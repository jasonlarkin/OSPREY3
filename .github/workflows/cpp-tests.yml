name: C++ Deep Copy Tests

on:
  push:
    branches:
      - 'ten63-demo/**'
      - main
    paths:
      - 'src/main/cc/DeepCopy/**'
      - '.github/workflows/cpp-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/main/cc/DeepCopy/**'
      - '.github/workflows/cpp-tests.yml'

jobs:
  cpp-tests:
    name: C++ Unit Tests (Deep Copy)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          g++ \
          make \
          openjdk-17-jdk
    
    - name: Generate Test Data
      id: generate_test_data
      run: |
        echo "## Generating Test Data" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Generate synthetic test data for integration tests
        chmod +x tools/capture-test-data.sh
        echo "Running test data generation script..." >> $GITHUB_STEP_SUMMARY
        
        # Run with explicit error handling
        set +e  # Don't exit on error, we'll check manually
        ./tools/capture-test-data.sh synthetic 2>&1 | tee test-data-generation.log
        GENERATION_EXIT_CODE=${PIPESTATUS[0]}
        set -e
        
        # Show generation log
        if [ -f test-data-generation.log ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generation Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-data-generation.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
        
        # Verify test data was generated
        if [ -d test-data/serialized ] && [ "$(ls -A test-data/serialized/*.bin 2>/dev/null)" ]; then
          echo "Test data generated successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Generated files:" >> $GITHUB_STEP_SUMMARY
          ls -lh test-data/serialized/*.bin >> $GITHUB_STEP_SUMMARY
          echo "test_data_generated=true" >> $GITHUB_OUTPUT
          
          # Show absolute path for debugging
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Test data location: $(pwd)/test-data/serialized/" >> $GITHUB_STEP_SUMMARY
        else
          echo "Warning: Test data files not found (exit code: ${GENERATION_EXIT_CODE})" >> $GITHUB_STEP_SUMMARY
          echo "Integration tests may fail if data is not found" >> $GITHUB_STEP_SUMMARY
          echo "test_data_generated=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Build
      working-directory: src/main/cc/DeepCopy
      run: |
        mkdir -p build
        cd build
        cmake .. -DBUILD_TESTS=ON
        cmake --build . -j4 2>&1 | tee build.log
        
        # Verify integration test file is in the build
        echo "=== Build Verification ==="
        echo "Checking if integration test source is included..."
        if [ -f "../tests/integration/test_captured_data.cpp" ]; then
          echo "✓ Integration test source file found"
        else
          echo "✗ WARNING: Integration test source file not found"
        fi
        
        # Check if integration test file was compiled
        echo "Checking if integration test was compiled..."
        if grep -q "test_captured_data" build.log; then
          echo "✓ Integration test file was compiled"
          grep "test_captured_data" build.log
        else
          echo "✗ WARNING: Integration test file NOT found in build log"
          echo "Checking what test files WERE compiled:"
          grep -i "test.*\.cpp" build.log | head -15
          echo ""
          echo "Checking CMake configuration for test files:"
          if [ -f "../tests/CMakeLists.txt" ]; then
            echo "CMakeLists.txt contents:"
            cat ../tests/CMakeLists.txt
          fi
        fi
        
        # Check if test executable was built
        if [ -f "tests/deepcopy_tests" ]; then
          echo "✓ Test executable built successfully"
          # Check if integration test symbols are in the binary
          echo "Checking for IntegrationTest symbols in binary..."
          if nm tests/deepcopy_tests 2>/dev/null | grep -qi "IntegrationTest"; then
            echo "✓ IntegrationTest symbols found in binary"
            nm tests/deepcopy_tests 2>/dev/null | grep -i "IntegrationTest" | head -5
          else
            echo "✗ WARNING: IntegrationTest symbols NOT found in binary"
            echo "Checking what test-related symbols ARE in the binary..."
            nm tests/deepcopy_tests 2>/dev/null | grep -i "test" | head -10
          fi
        else
          echo "✗ ERROR: Test executable not found"
        fi
    
    - name: Run Tests
      id: test
      working-directory: src/main/cc/DeepCopy/build
      run: |
        # Verify test data is accessible from build directory
        echo "=== Checking test data accessibility ==="
        pwd
        REPO_ROOT="../../../../../../"
        echo "Looking for test data at: ${REPO_ROOT}test-data/serialized/"
        if [ -d "${REPO_ROOT}test-data/serialized" ]; then
          echo "Test data directory exists"
          ls -lh "${REPO_ROOT}test-data/serialized/"*.bin 2>&1 || echo "No .bin files found"
        else
          echo "Test data directory not found at ${REPO_ROOT}test-data/serialized/"
          echo "Trying alternative paths..."
          ls -la ../../../../../test-data/serialized/*.bin 2>&1 || true
          ls -la ../../../../test-data/serialized/*.bin 2>&1 || true
        fi
        
        # List all available tests and count them
        echo ""
        echo "=== Listing all available tests ==="
        ./tests/deepcopy_tests --gtest_list_tests 2>&1 | tee test-list.log
        
        # Show test list for debugging (also add to summary)
        echo ""
        echo "=== Full test list output ==="
        cat test-list.log
        echo ""
        echo "=== Full test list output ===" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat test-list.log >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Count tests (ensure we have valid numbers)
        TOTAL_TEST_COUNT=$(grep -c "^\s" test-list.log 2>/dev/null || echo "0")
        INTEGRATION_TEST_COUNT=$(grep -c "IntegrationTest\." test-list.log 2>/dev/null || echo "0")
        
        # Ensure we have valid integers
        if [ -z "${TOTAL_TEST_COUNT}" ] || [ "${TOTAL_TEST_COUNT}" = "" ]; then
          TOTAL_TEST_COUNT="0"
        fi
        if [ -z "${INTEGRATION_TEST_COUNT}" ] || [ "${INTEGRATION_TEST_COUNT}" = "" ]; then
          INTEGRATION_TEST_COUNT="0"
        fi
        
        echo "Total tests discovered: ${TOTAL_TEST_COUNT}"
        echo "Integration tests discovered: ${INTEGRATION_TEST_COUNT}"
        echo "**Total tests discovered:** ${TOTAL_TEST_COUNT}" >> $GITHUB_STEP_SUMMARY
        echo "**Integration tests discovered:** ${INTEGRATION_TEST_COUNT}" >> $GITHUB_STEP_SUMMARY
        
        # Also check if IntegrationTest class appears at all
        if grep -q "IntegrationTest" test-list.log; then
          echo "✓ IntegrationTest class found in test list"
        else
          echo "✗ WARNING: IntegrationTest class NOT found in test list"
          echo "Checking if test file was compiled..."
          SYMBOL_CHECK=$(nm ./tests/deepcopy_tests 2>/dev/null | grep -i integration | head -5 || echo "IntegrationTest symbols not found in binary")
          echo "${SYMBOL_CHECK}"
          echo "**Symbol check:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${SYMBOL_CHECK}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "total_tests=${TOTAL_TEST_COUNT}" >> $GITHUB_OUTPUT
        echo "integration_tests_discovered=${INTEGRATION_TEST_COUNT}" >> $GITHUB_OUTPUT
        
        # Run tests with full output (same as local)
        echo ""
        echo "=== Running C++ tests ==="
        ./tests/deepcopy_tests 2>&1 | tee test-output.log
        TEST_EXIT_CODE=${PIPESTATUS[0]}
        echo "exit_code=${TEST_EXIT_CODE}" >> $GITHUB_OUTPUT
        
        # Check if integration tests ran
        if grep -q "IntegrationTest" test-output.log; then
          echo "Integration tests detected in output"
          INTEGRATION_COUNT=$(grep -c "IntegrationTest\." test-output.log || echo "0")
          echo "integration_tests_found=${INTEGRATION_COUNT}" >> $GITHUB_OUTPUT
        else
          echo "Warning: No IntegrationTest tests found in output"
          echo "integration_tests_found=0" >> $GITHUB_OUTPUT
        fi
        
        exit ${TEST_EXIT_CODE}
    
    - name: Test Summary
      if: always()
      working-directory: src/main/cc/DeepCopy/build
      run: |
        echo "## C++ Deep Copy Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f test-output.log ]; then
          echo "### Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Extract test counts with error handling
          TOTAL_LINE=$(grep "\[  PASSED  \]" test-output.log | tail -1)
          if [ -n "${TOTAL_LINE}" ]; then
            TOTAL_TESTS=$(echo "${TOTAL_LINE}" | grep -oE '[0-9]+' | head -1)
            FAILED_TESTS=$(grep -c "\[  FAILED  \]" test-output.log 2>/dev/null || echo "0")
            
            if [ -n "${TOTAL_TESTS}" ] && [ "${TOTAL_TESTS}" -ge 0 ] 2>/dev/null && [ -n "${FAILED_TESTS}" ] && [ "${FAILED_TESTS}" -ge 0 ] 2>/dev/null; then
              PASSED_TESTS=$(expr "${TOTAL_TESTS}" - "${FAILED_TESTS}" 2>/dev/null || echo "0")
              echo "- **Total Tests:** ${TOTAL_TESTS}" >> $GITHUB_STEP_SUMMARY
              echo "- **Passed:** ${PASSED_TESTS}" >> $GITHUB_STEP_SUMMARY
              echo "- **Failed:** ${FAILED_TESTS}" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          # Check for integration tests
          INTEGRATION_DISCOVERED="${{ steps.test.outputs.integration_tests_discovered }}"
          if [ -n "${INTEGRATION_DISCOVERED}" ] && [ "${INTEGRATION_DISCOVERED}" -gt 0 ]; then
            echo "- **Integration Tests Discovered:** ${INTEGRATION_DISCOVERED}" >> $GITHUB_STEP_SUMMARY
          fi
          
          if grep -q "IntegrationTest" test-output.log; then
            INTEGRATION_COUNT=$(grep -c "IntegrationTest\." test-output.log || echo "0")
            echo "- **Integration Tests Executed:** ${INTEGRATION_COUNT}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Integration Tests:** Not executed (test data may be missing or tests failed early)" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Show test data status
          TEST_DATA_GENERATED="${{ steps.generate_test_data.outputs.test_data_generated }}"
          if [ "${TEST_DATA_GENERATED}" = "true" ]; then
            echo "- **Test Data:** Generated successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Test Data:** Not generated (integration tests will fail)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Show full test output (same as local)
          echo "### Full Test Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        else
          echo "Test output log not found" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cpp-test-results
        path: |
          src/main/cc/DeepCopy/build/Testing/**
          src/main/cc/DeepCopy/build/test-output.log
        retention-days: 7

